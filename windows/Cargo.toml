[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/tip", "crates/harness"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/HaloKim/seamtype-rust"

[workspace.dependencies]
seamtype-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = "0.62"
windows-core = "0.62"

[profile.release]
lto = true
codegen-units = 1
