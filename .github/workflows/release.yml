# Builds the Windows installer and attaches it to a GitHub release when a version tag is pushed
# (git tag v0.1.5 && git push origin v0.1.5). The tag should match windows/Cargo.toml's version.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust targets
        run: rustup target add i686-pc-windows-msvc
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Test
        working-directory: windows
        run: cargo test -p seamtype-core
      - name: Build the installer
        run: powershell -ExecutionPolicy Bypass -File windows\installer\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Seamtype-Setup
          path: windows/target/installer/*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/target/installer/*.exe
          generate_release_notes: true
